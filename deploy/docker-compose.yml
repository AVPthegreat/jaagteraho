# One Vultr Compute instance runs everything except the website (Vercel).
# The demo portal builds are internal only: visitors reach them through the watcher.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      JR_API_DOMAIN: ${JR_API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [watcher]

  watcher:
    build: ../watcher
    restart: unless-stopped
    env_file: ../watcher/.env
    environment:
      JR_TWIN_BROKEN_URL: http://twin-broken:8000
      JR_TWIN_FIXED_URL: http://twin-fixed:8000
      # A read-only copy of the demo portal's code, used only to prove fixes with a regression test.
      JR_SANDBOX_SOURCE: /sandbox
      # The Live playground's apps and planted bugs, read here only to show and diagnose them.
      JR_BENCH_DIR: /bench
      # All app code and AI-written code runs in the "runner" service below, never in this container.
      JR_RUNNER_SOCKET: /run/jr/runner.sock
    volumes:
      - watcher_data:/data
      - ../sandbox:/sandbox:ro
      - ../bench:/bench:ro
      - runner_sock:/run/jr
    depends_on: [runner]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The isolated runner: the only place app code and AI-written code (planted-bug crashes, hidden tests,
  # fix proofs) runs. No network at all, no env_file and no secrets, read-only root, a small tmpfs, a
  # non-root user, no capabilities, and pid/memory/CPU limits. It talks to the watcher only through a unix
  # socket on the runner_sock volume.
  runner:
    build: ../watcher
    restart: unless-stopped
    command: ["node", "--import", "tsx", "src/runner/server.ts"]
    network_mode: none
    read_only: true
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    environment:
      HOME: /tmp
      JR_RUNNER_LISTEN: /run/jr/runner.sock
      JR_BENCH_DIR: /bench
      JR_SANDBOX_SOURCE: /sandbox
    volumes:
      - runner_sock:/run/jr
      - ../bench:/bench:ro
      - ../sandbox:/sandbox:ro

  twin-broken:
    build: { context: ../sandbox, args: { BUILD: broken } }
    restart: unless-stopped
    environment:
      SENTRY_DSN: ${SANDBOX_DSN}
      ALLOWED_HOSTS: twin-broken,localhost
      JR_RELEASE: broken-1

  twin-fixed:
    build: { context: ../sandbox, args: { BUILD: fixed } }
    restart: unless-stopped
    environment:
      SENTRY_DSN: ${SANDBOX_DSN}
      ALLOWED_HOSTS: twin-fixed,localhost
      JR_RELEASE: fixed-1

  # Copies the database every 6 hours with SQLite's online backup.
  backup:
    image: keinos/sqlite3:3.46.1
    restart: unless-stopped
    user: root
    volumes:
      - watcher_data:/data:ro
      - ./backups:/backups
    entrypoint: ["sh", "-c", "while true; do sqlite3 /data/jaagteraho.db \".backup /backups/jaagteraho-$$(date +%Y%m%d-%H%M).db\"; sleep 21600; done"]

volumes:
  caddy_data:
  watcher_data:
  # The unix socket between the watcher and the runner (nothing else is on it).
  runner_sock:

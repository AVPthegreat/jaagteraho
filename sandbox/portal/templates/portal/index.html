<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo exam portal</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f6fb; color: #1d2433; }
  main { max-width: 640px; margin: 40px auto; padding: 0 16px; display: grid; gap: 16px; }
  .note { background: #fff7e0; border: 1px solid #f2b441; border-radius: 8px; padding: 12px 14px; font-size: 14px; }
  button { font: inherit; padding: 12px 16px; border-radius: 8px; border: 1px solid #c5cde0; background: #fff; cursor: pointer; min-height: 44px; }
  pre { background: #fff; border: 1px solid #c5cde0; border-radius: 8px; padding: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>Demo exam portal</h1>
  <p class="note">This is a sandbox for JaagteRaho with faults planted on purpose. Build: <strong>{{ build }}</strong>. No real students use it.</p>
  <div style="display:flex; gap:8px; flex-wrap:wrap">
    <button type="button" data-path="/api/submit">Submit code</button>
    <button type="button" data-path="/api/exam/start">Start exam</button>
    <button type="button" data-path="/api/pay">Pay fee</button>
  </div>
  <pre id="out" aria-live="polite">Press a button.</pre>
</main>
<script>
  document.querySelectorAll("button[data-path]").forEach((b) => b.addEventListener("click", async () => {
    const r = await fetch(b.dataset.path, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    document.getElementById("out").textContent = r.status + " " + (await r.text());
  }));
</script>
</body>
</html>
